<!DOCTYPE html>
<html>
    <head>
        <title>trbot: candle visualizer</title>
        <style>
            body {
                height: 100vh;
                padding: 0;
                margin: 0;
            }
            #tv-charts {
                height: 100%;
                margin-block: auto;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
            }
            #main-chart {
                margin-bottom: 2em;
                position: relative;
            }
            #main-info {
                position: absolute;
                z-index: 2;
                height: fit-content;
                padding-top: 0.3em;
                padding-left: 0.6em;
                display: flex;
            }
            .main-symbol-info {
                color: #fcfcfc;
                font-size: 1.3em;
                margin-right: 1em;
            }
            .main-ohlcv-info-parts {
                color: #f0f0f0;
                font-size: 1em;
            }
        </style>
    </head>
    <body>
        <div id="tv-charts">
            <div id="main-chart">
                <div id="main-info"></div>
            </div>
            <div id="secondary-chart"></div>
        </div>

        <script type="module" src="./index.mjs"></script>
    </body>
</html>
